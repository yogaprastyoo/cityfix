# CityFix - Nginx virtual host (Tahap 4 §12-13)
# Salin ke /etc/nginx/sites-available/cityfix, symlink ke sites-enabled,
# lalu: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d cityfix.example.sch.id  (Certbot menambah blok 443 + redirect HTTP->HTTPS)

server {
    listen 80;
    server_name cityfix.example.sch.id;
    root /var/www/cityfix/public;

    index index.php;
    charset utf-8;

    # Foto laporan maksimal 5 MB (validasi Laravel); beri sedikit ruang untuk form multipart.
    client_max_body_size 8M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Sesuaikan versi socket PHP-FPM yang terpasang (cek: ls /var/run/php/)
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Tolak file tersembunyi (.env, .git, dll.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
